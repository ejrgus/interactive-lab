<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Interactive Lab test page">
  <title>TEST</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23070a12'/%3E%3Cpath d='M16 20h32M32 20v28' stroke='%2375f5d8' stroke-width='7' stroke-linecap='round'/%3E%3C/svg%3E">
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #070a12;
      color: #f6f8fb;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(circle at 20% 20%, rgba(117, 245, 216, .16), transparent 30rem),
        radial-gradient(circle at 80% 80%, rgba(101, 126, 255, .18), transparent 32rem),
        #070a12;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      opacity: .22;
      background-image:
        linear-gradient(rgba(255, 255, 255, .06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, .06) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(circle, black, transparent 72%);
      pointer-events: none;
    }

    h1 {
      margin: 0;
      font-size: clamp(5rem, 22vw, 18rem);
      line-height: .82;
      letter-spacing: -.08em;
      font-weight: 900;
      background: linear-gradient(120deg, #ffffff 10%, #75f5d8 48%, #8294ff 92%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 18px 50px rgba(67, 211, 188, .18));
      animation: appear .8s cubic-bezier(.2, .8, .2, 1) both;
    }

    @keyframes appear {
      from { opacity: 0; transform: translateY(24px) scale(.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      h1 { animation: none; }
    }
  </style>
</head>
<body>
  <main>
    <h1>TEST</h1>
  </main>
</body>
</html>
