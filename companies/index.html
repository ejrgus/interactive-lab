<body class="tree-page">

      <nav class="site-nav" id="site-nav" aria-label="주요 메뉴"><a href="../index.html">홈</a><a class="is-active" href="index.html" aria-current="page">기업 계보</a><a href="../immune/index.html">면역체계</a><a href="../README.md">프로젝트 소개</a></nav>

  <main id="tree-main" class="tree-app">
    <aside class="tree-sidebar" id="tree-sidebar" aria-label="기업 계보 선택">
      <div class="sidebar-heading">
        <div><p class="sidebar-kicker">Lineage explorer</p><h1>계보 탐색</h1></div>
        <button class="sidebar-close" type="button" data-sidebar-close aria-label="계보 목록 닫기">‹</button>
      </div>
      <label class="search-box" for="tree-search">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m21 21-4.5-4.5m2.5-5A7.5 7.5 0 1 1 4 11.5a7.5 7.5 0 0 1 15 0Z"/></svg>
        <input id="tree-search" type="search" placeholder="기업·계열 검색" autocomplete="off">
        <kbd aria-hidden="true">/</kbd>
      </label>
      <p class="search-help" id="search-help">예: 현대자동차</p>
      <nav class="family-list" aria-label="기업 집단 목록">
        <p class="family-label">기업 집단</p>
        <button class="family-item is-active" type="button" aria-current="true"><span class="family-dot"></span><span><strong>범현대가</strong><small>구조 미리보기</small></span><span aria-hidden="true">›</span></button>
        <button class="family-item" type="button" disabled><span class="family-dot"></span><span><strong>범삼성가</strong><small>준비 중</small></span><span aria-hidden="true">›</span></button>

        <button class="family-item" type="button" disabled><span class="family-dot"></span><span><strong>범SK가</strong><small>준비 중</small></span><span aria-hidden="true">›</span></button>
        <button class="family-item" type="button" disabled><span class="family-dot"></span><span><strong>범롯데가</strong><small>준비 중</small></span><span aria-hidden="true">›</span></button>
      </nav>
      <div class="sidebar-note"><span aria-hidden="true">i</span><p>공식 자료를 우선 확인하고, 나무위키는 조사 단서를 찾는 참고 자료로만 사용합니다.</p></div>
    </aside>

    <section class="tree-workspace" aria-labelledby="tree-title">
      <button class="sidebar-open" type="button" data-sidebar-open aria-controls="tree-sidebar" aria-expanded="true"><span aria-hidden="true">☰</span><span>계보 목록</span></button>
      <div class="tree-toolbar">
        <div class="tree-heading"><p class="tree-eyebrow">Corporate tech tree</p><h2 id="tree-title">범현대가</h2></div>
        <div class="toolbar-right"><span class="preview-badge"><span></span>구조 설계 미리보기</span><button class="reset-view" type="button" data-reset-view>처음 위치</button></div>
      </div>
      <div class="research-banner" role="note"><strong>현재는 큰 틀을 만드는 단계입니다.</strong><span>연도, 분리 사유, 지배구조와 연결 관계는 출처 검증 후 확정합니다.</span></div>
      <div class="legend" aria-label="연결선 범례">
        <span><i class="legend-line continuation"></i>존속·연결</span><span><i class="legend-line split"></i>분리</span><span><i class="legend-line merger"></i>합병</span><span><i class="legend-line dissolved"></i>폐지</span>

      <div class="tree-viewport" id="tree-viewport" tabindex="0" aria-label="범현대가 가로형 계보. Shift와 마우스 휠 또는 가로 스크롤로 이동할 수 있습니다.">
        <div class="tree-canvas" id="tree-canvas" aria-busy="true"><svg class="connector-layer" id="connector-layer" aria-hidden="true"></svg><div class="stage-layer" id="stage-layer" aria-hidden="true"></div><div class="node-layer" id="node-layer"></div></div>
      </div>
      <div class="scroll-hint" aria-hidden="true"><span>과거</span><i></i><span>현재</span></div>
